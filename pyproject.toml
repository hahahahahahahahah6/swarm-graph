[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-graph"
version = "0.1.0"
description = "Multi-agent shared state graph: atomic task claiming, dependency planning, and conflict detection on FalkorDB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hao li" }]
keywords = ["falkordb", "multi-agent", "orchestration", "mcp", "graph"]
dependencies = [
    "falkordb>=1.0",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
swarm-graph-mcp = "swarm_graph.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
