name: tests

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install falkordb pytest
      - name: run tests
        run: |
          set +e
          PYTHONPATH=src pytest tests/ -q > /tmp/pytest.log 2>&1
          code=$?
          echo "PYTEST_EXIT=$code"
          tail -15 /tmp/pytest.log
          exit $code
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_PORT: ${{ secrets.SWARM_PORT }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          SWARM_PASSWORD: ${{ secrets.SWARM_PASSWORD }}
      - name: run demo
        run: |
          set +e
          timeout 120 python3 demo/demo_scenario.py > /tmp/demo.log 2>&1
          code=$?
          echo "DEMO_EXIT=$code"
          tail -30 /tmp/demo.log
          exit $code
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_PORT: ${{ secrets.SWARM_PORT }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          SWARM_PASSWORD: ${{ secrets.SWARM_PASSWORD }}
